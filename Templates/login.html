{%extends 'Layout/base.html'%}
{%block content%}

{% if err_msg %}
<div class="alert alert-danger alert-dismissible fade show py-2 small" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ err_msg }}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
{% endif %}

{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show py-2 small" role="alert">
            <i class="bi bi-check-circle-fill me-1"></i> {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
    {% endif %}
{% endwith %}
<form method="post" action="/login">
                            <div class="mb-3">
                                <label class="form-label fw-medium small text-secondary">Tên đăng nhập</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-primary">
                                        <i class="bi bi-person-fill"></i>
                                    </span>
                                    <input type="text" name="tenDangNhap" class="form-control border-start-0 ps-0" placeholder="Nhập tên đăng nhập" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-medium small text-secondary">Mật khẩu</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-primary">
                                        <i class="bi bi-lock-fill"></i>
                                    </span>
                                    <input type="password" name="matKhau" class="form-control border-start-0 ps-0" placeholder="Nhập mật khẩu" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold shadow-sm mb-3">
                                <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập
                            </button>
                        </form>
{%endblock%}
