{%extends 'Layout/base.html'%}
{%block content%}

{% if err_msg %}
<div class="alert alert-danger alert-dismissible fade show py-2 small" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ err_msg }}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
{% endif %}

{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show py-2 small" role="alert">
            <i class="bi bi-check-circle-fill me-1"></i> {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
    {% endif %}
{% endwith %}
<form method="post" action="/register">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-medium small text-secondary">Họ và tên <span class="text-danger">*</span></label>
                                    <input type="text" name="hoTen" class="form-control" placeholder="Nguyễn Văn A" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-medium small text-secondary">Tên đăng nhập <span class="text-danger">*</span></label>
                                    <input type="text" name="tenDangNhap" class="form-control" placeholder="nguyenvana" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-medium small text-secondary">Email <span class="text-danger">*</span></label>
                                    <input type="email" name="email" class="form-control" placeholder="email@example.com" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-medium small text-secondary">Số điện thoại <span class="text-danger">*</span></label>
                                    <input type="tel" name="soDienThoai" class="form-control" placeholder="0901234567" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-medium small text-secondary">Ngày sinh</label>
                                    <input type="date" name="ngaySinh" class="form-control">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-medium small text-secondary">Địa chỉ</label>
                                    <input type="text" name="diaChi" class="form-control" placeholder="Quận 3, TP.HCM">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-medium small text-secondary">Mật khẩu <span class="text-danger">*</span></label>
                                    <input type="password" name="matKhau" class="form-control" placeholder="Tối thiểu 6 ký tự" minlength="6" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-medium small text-secondary">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                                    <input type="password" name="xacNhanMatKhau" class="form-control" placeholder="Nhập lại mật khẩu" minlength="6" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold shadow-sm mt-4 mb-3">
                                <i class="bi bi-person-plus-fill me-1"></i>Đăng ký tài khoản
                            </button>
                        </form>
{%endblock%}
